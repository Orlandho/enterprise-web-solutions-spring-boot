# ==============================================================================
# CONFIGURACIÓN POR DEFECTO — ENTORNO DE DESARROLLO Y EVALUACIÓN (H2 IN-MEMORY)
# Zero-setup: Permite ejecutar, persistir y probar la API sin instalar MySQL
# ==============================================================================
server.port=8080

# Nombre de la aplicación
spring.application.name=enterprise-web-solutions-spring-boot

# Configuración de Base de Datos H2
spring.datasource.url=jdbc:h2:mem:enterprise_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola Web H2 (Acceso interactivo en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Inicialización de Datos Semilla con data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Swagger / OpenAPI 3 (Acceso en http://localhost:8080/swagger-ui/index.html)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
