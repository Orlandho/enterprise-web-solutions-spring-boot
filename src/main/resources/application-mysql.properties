# ==============================================================================
# PERFIL MYSQL — ENTORNO EMPRESARIAL / CURSO UPN (bd_swad_lab04 / bd_swad_lab03)
# Activación: ./mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# ==============================================================================
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bd_swad_lab04?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate con dialecto MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Deshabilitar H2 console en perfil MySQL
spring.h2.console.enabled=false
